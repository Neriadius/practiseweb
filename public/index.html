    <h1>Hello from Express!</h1>
    
    <form action="/submit" method="post">
        <label for="name">First name:</label><br>
        <input type="text" id="name" name="name" placeholder="name"><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="email@email.com"><br><br>
        
        <input type="text" id="message" name="message" placeholder="Background"><br>
        
        <input type="submit" value="Submit">
    </form>

    <form action="/hello" method="post">
        <input type="submit" value="hello">
    </form>
    <form action="/user/:id" method="post">
        <input type="submit" value="user id">
    </form>
    <form action="/status" method="post">
        <input type="submit" value="status">
    </form>
    <form action="/sum" method="post">
        <input type="submit" value="sum">
    </form>
    <form action="/sm" method="post">
        <input type="submit" value="404">
    </form>

    <form action="/fast" method="get">
        <input type="submit" value="fast">
    </form>
    <form action="/slow-async" method="get">
        <input type="submit" value="slow slow-async">
    </form>
    <form action="/slow-blocking" method="get">
        <input type="submit" value="slow-blocking">
    </form>
    <form action="/file-async" method="get">
        <input type="submit" value="file-async">
    </form>
    <form action="/file-sync" method="get">
        <input type="submit" value="file-sync">
    </form>
    <form action="/status" method="get">
        <input type="submit" value="file-status">
    </form>
    
</body>
